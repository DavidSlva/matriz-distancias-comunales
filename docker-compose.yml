services:
  # Ruteador internacional: Chile mas Argentina. El extracto de Chile por si solo NO
  # contiene caminos argentinos, asi que sin este grafo la columna `solo_via_argentina`
  # no puede calcularse.
  osrm:
    image: osrm/osrm-backend
    command: osrm-routed --algorithm mld --max-table-size 10000 /data/cono-sur.osrm
    volumes:
      - ./datos/osrm_int:/data
    ports:
      - "5000:5000"

  # Ruteador nacional: el extracto recortado al territorio de Chile, aguas incluidas.
  # Un par con ruta en `osrm` y sin ruta aca es, por construccion, `solo_via_argentina`.
  osrm_cl:
    image: osrm/osrm-backend
    command: osrm-routed --algorithm mld --max-table-size 10000 /data/chile-recortado.osrm
    volumes:
      - ./datos/osrm_cl:/data
    ports:
      - "5001:5000"

  geo:
    build: .
    volumes:
      - .:/work
    working_dir: /work
    environment:
      OSRM_URL: http://osrm:5000
      OSRM_CL_URL: http://osrm_cl:5000
