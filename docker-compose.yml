services:
  # Ruteador sobre Chile completo. Incluye la red vial argentina fronteriza,
  # asi que rutea Punta Arenas desde el norte pasando por Argentina.
  osrm:
    image: osrm/osrm-backend
    command: osrm-routed --algorithm mld --max-table-size 10000 /data/chile-latest.osrm
    volumes:
      - ./datos/osrm:/data
    ports:
      - "5000:5000"

  # Mismo ruteador sobre el extracto recortado al poligono nacional. Un par con
  # ruta en `osrm` y sin ruta aca es, por construccion, `solo_via_argentina`.
  osrm_cl:
    image: osrm/osrm-backend
    command: osrm-routed --algorithm mld --max-table-size 10000 /data/chile-recortado.osrm
    volumes:
      - ./datos/osrm_cl:/data
    ports:
      - "5001:5000"

  geo:
    build: .
    volumes:
      - .:/work
    working_dir: /work
    environment:
      OSRM_URL: http://osrm:5000
      OSRM_CL_URL: http://osrm_cl:5000
