# Fuentes publicas del dataset. `src/01_descargar.py` las baja y verifica el md5.
#
# Los archivos crudos no se versionan (453 MB): este manifiesto es el que permite
# reconstruirlos byte a byte.
#
# Las tres fuentes exigen `User-Agent`. Sin el, BCN responde 401 y Geofabrik corta
# la conexion sin mensaje.

fuentes:
  - nombre: comunas
    descripcion: Poligonos de las comunas de Chile, division politico administrativa
    url: https://www.bcn.cl/obtienearchivo?id=repositorio/10221/10396/5/comunas_final.zip
    archivo: comunas_final.zip
    descomprimir_en: comunas
    # BCN republica sin versionar. Este es el md5 observado el 2026-08-31: si cambia,
    # la descarga falla a proposito, para que nadie reconstruya sobre otro insumo sin
    # enterarse.
    md5: d297e9b14da09408d2698492fbab0dcc
    atribucion: Biblioteca del Congreso Nacional de Chile
    licencia: uso libre con atribucion

  - nombre: areas_pobladas
    descripcion: Poligonos de localidades y areas pobladas
    url: https://www.bcn.cl/obtienearchivo?id=repositorio/10221/10405/2/Areas_Pobladas.zip
    archivo: Areas_Pobladas.zip
    descomprimir_en: areas_pobladas
    md5: 9853fb797641c99d388a2b1dfe0aaaa9   # observado el 2026-08-31
    atribucion: Biblioteca del Congreso Nacional de Chile
    licencia: uso libre con atribucion

  - nombre: osm
    descripcion: Extracto de OpenStreetMap para Chile, insumo de los grafos de ruteo
    url: https://download.geofabrik.de/south-america/chile-latest.osm.pbf
    archivo: chile-latest.osm.pbf
    md5_url: https://download.geofabrik.de/south-america/chile-latest.osm.pbf.md5
    md5: 6ba274aae78ea1d279a06a9a194e7649   # corte del 2026-08-31
    atribucion: (c) colaboradores de OpenStreetMap
    licencia: ODbL 1.0

  - nombre: osm_argentina
    descripcion: >
      Extracto de OpenStreetMap para Argentina. Necesario porque el extracto de Chile
      NO contiene caminos argentinos: sin este archivo la columna solo_via_argentina
      no puede calcularse, y durante un tiempo el dataset publico una columna que
      decia "solo se llega por Argentina" sobre un grafo donde Argentina no existia.
    url: https://download.geofabrik.de/south-america/argentina-latest.osm.pbf
    archivo: argentina-latest.osm.pbf
    md5_url: https://download.geofabrik.de/south-america/argentina-latest.osm.pbf.md5
    md5: 6caa97d2c9432d2d952e268d8e13dcd5   # corte del 2026-09-01
    atribucion: (c) colaboradores de OpenStreetMap
    licencia: ODbL 1.0

  - nombre: paises
    descripcion: >
      Poligonos de paises de Natural Earth 1:10m. Se usan para construir el poligono
      de recorte: Chile dilatado hacia el mar menos la tierra de Argentina, Bolivia y
      Peru. Recortar con la union de comunas (tierra) eliminaba las rutas de barcaza.
    url: https://naciscdn.org/naturalearth/10m/cultural/ne_10m_admin_0_countries.zip
    archivo: ne_paises.zip
    descomprimir_en: ne_paises
    md5: 0bc33f3e6f9ab457917430e57f6122a9
    atribucion: Natural Earth
    licencia: dominio publico

  - nombre: poblacion
    descripcion: Grilla de poblacion 2020, version constrained (solo donde hay edificacion)
    url: https://data.worldpop.org/GIS/Population/Global_2000_2020_Constrained/2020/BSGM/CHL/chl_ppp_2020_UNadj_constrained.tif
    archivo: chl_pop_2020.tif
    md5: 72fe8780ea9ecf1e6da91007f346a6f4   # observado el 2026-08-31
    atribucion: WorldPop (www.worldpop.org)
    licencia: CC-BY 4.0
